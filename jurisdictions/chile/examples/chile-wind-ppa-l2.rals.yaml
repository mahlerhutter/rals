# ── Risk Flags (Jurisdiction Package) ────────────────────────────────────────
risk_flags:
  - risk_id: grid_not_secured
    active: true
    severity: high
    note: >
      CEN connection agreement NOT signed. Technical review in progress (submitted
      October 2025, expected completion Q2 2026). Connection agreement with SAESA
      not yet negotiated. Hard blocker for L3 classification and for construction
      financing drawdown. This is the primary remaining risk for this asset.

  - risk_id: unclear_revenue_route
    active: true
    severity: medium
    note: >
      PPA term sheet received (January 2026, USD 52/MWh, 15 years, 70 MW) but
      NOT executed. Mining company board approval pending. Exclusivity period
      expired; re-negotiation in progress. PPA contract not signed is a hard
      blocker for L3 revenue threshold. 10 MW exposed to SEIN spot — manageable
      in Biobío but must be disclosed.

  - risk_id: curtailment_atacama
    active: false
    note: >
      Asset is in Biobío Region, not Antofagasta/Atacama. Structural northern Chile
      curtailment risk does not apply. DNV assessment includes 1.5% Biobío curtailment
      — not zero, but materially lower. No zero-price spot risk at this node.

  - risk_id: indigenous_consultation_delay
    active: false
    note: >
      PCPI confirmed not applicable by SEA screening (August 2024) and anthropological
      survey (January 2025). No indigenous territories in project area of influence.

  - risk_id: dga_water_rights
    active: false
    note: "Onshore wind only. DGA water rights not required."

  - risk_id: rca_under_appeal
    active: false
    note: >
      RCA is final and uncontested. Reclamation period expired 20 August 2025
      without challenge. Legal opinion confirms RCA finality.

  - risk_id: land_not_secured
    active: false
    note: >
      Long-term 30-year lease signed and registered at Conservador de Bienes Raíces
      (February 2026). Title search confirms no adverse encumbrances. Land risk cleared.

  - risk_id: merchant_price_volatility_chile
    active: true
    severity: low
    note: >
      10 MW of 80 MW capacity is uncontracted (exposed to SEIN Biobío spot). Biobío
      spot price risk is LOW compared to Atacama — no structural zero-price risk.
      If PPA negotiations for 70 MW fail, full 80 MW would be exposed to spot —
      this scenario raises severity to MEDIUM. Aurora price forecast included in model.

  - risk_id: ppa_financing_difficulty
    active: true
    severity: low
    note: >
      80 MW onshore wind (not pure solar). Storage not planned. PPA term sheet with
      mining offtaker is the standard structure for this asset type in Chile. Risk
      is LOW for wind compared to solar in this context — wind's non-solar generation
      profile reduces merchant price correlation with solar oversupply events.
