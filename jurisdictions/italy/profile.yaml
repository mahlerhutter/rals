disclaimer: >
  This jurisdiction package is a technical reference for transaction-readiness assessment.
  It is not legal advice. Italian renewable energy regulation, grid connection rules,
  and support scheme terms change frequently. Always verify with qualified Italian
  legal counsel and Terna or the relevant DSO before relying on this package.
