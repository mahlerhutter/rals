grid_authorities:
  tso: "Georgian State Electrosystem (GSE)"
  tso_url: "https://www.gse.com.ge"
  tso_note: >
    GSE is the sole transmission system operator in Georgia. All generation projects
    connecting at transmission level must obtain technical conditions and a connection
    agreement directly from GSE. Distribution-level connections are handled by regional
    distribution companies (e.g., Telasi in Tbilisi, Energo-Pro Georgia in other regions).
  grid_connection_process: >
    Standard GSE connection process: (1) application to GSE, (2) GSE issues technical
    conditions letter, (3) negotiation and signing of connection agreement,
    (4) construction of connection infrastructure, (5) testing and commissioning,
    (6) COD. Typical timeline: 6–9 months from application to connection agreement.
  grid_capacity_note: >
    West Georgia (Adjara, Samegrelo, Imereti regions) has significant transmission
    constraints due to concentration of hydro generation. Curtailment by GSE is
    possible without compensation obligations where system stability requires it.
    East Georgia (Kakheti, Shida Kartli) generally has better grid capacity for
    new solar and wind projects.

market_design_notes:
  cfd_scheme: >
    Georgia introduced Contract for Difference (CfD) auctions in 2022. Government
    auctions renewable capacity on a competitive basis; winning developers receive
    a 15-year fixed strike price (CfD). The March 2023 auction (300 MW) was
    oversubscribed. The February 2024 auction (800 MW) was also oversubscribed.
    Not all applicants win — CfD award is required for revenue certainty on
    CfD-route projects. CfD contracts are administered by the Government of Georgia.
  esco_market: >
    ESCO (Electricity System Commercial Operator) manages the wholesale electricity
    market. Generators can bid capacity and energy in the ESCO market.
    ESCO provides a fallback revenue route for non-CfD generators but is less
    predictable than a CfD or PPA contract.
  industrial_ppa: >
    Direct PPAs between generators and large industrial consumers (threshold: >100 kW
    consumption) are legal and growing. PPA durations typically 5–15 years.
    Georgian industrial sector (mining, cement, ferroalloys) is a significant
    offtake base. PPA counterparty credit quality is variable.
  regulated_tariff: >
    Historically GNERC issued fixed tariffs for smaller or older projects.
    Declining relevance for new projects; new projects typically target CfD or PPA.
  export_ppa_turkey: >
    Georgia–Turkey electricity exports began under limited commercial PPAs in 2023.
    Export volumes are constrained by interconnection capacity and Turkish market access.
  black_sea_export: >
    Black Sea Submarine Cable Project (connecting Georgia and Azerbaijan to Romania
    and Hungary) completed feasibility study in 2024. Operational target: 2029–2032.
    If completed, would open EU export markets and significantly increase demand for
    Georgian renewable generation. Project remains at development stage.
  hydro_dominance: >
    Hydro (primarily run-of-river) dominates Georgian electricity generation.
    Significant seasonal imbalance: 40–60% of electricity is imported in winter due
    to low river flows. This creates both risk (revenue seasonality) and opportunity
    (high summer spot prices for new solar/wind displacing imports).
  permitting_note: >
    Construction permits for RES projects (Class II–IV) are issued by local municipalities.
    Strategic or large projects (typically >50–100 MW, or those of national significance)
    may require Ministry of Regional Development involvement and a concession agreement
    from the Government. EIA/environmental clearance is required for all material projects.
    Hydrological studies are mandatory for hydro projects.

