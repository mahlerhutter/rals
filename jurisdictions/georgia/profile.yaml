disclaimer: >
  This jurisdiction package is a technical reference for transaction-readiness assessment.
  It is not legal advice. Georgian energy law, GNERC licensing procedures, CfD auction
  rules, and GSE grid connection requirements change and should be verified with qualified
  Georgian legal counsel, a local energy advisor, and directly with GNERC and GSE before
  relying on this package for a specific transaction. The CfD auction programme is at
  an early stage and rules may evolve.
