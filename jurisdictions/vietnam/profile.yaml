    - financial_model_audit
    - tax_structuring
    - regulatory_compliance_certification
    - vietnamese_law_advice

disclaimer: >
  This jurisdiction package is a technical reference for transaction-readiness assessment.
  It is not legal advice. Vietnam's renewable energy regulatory framework is subject to
  frequent and material change — including at the level of government decrees. The
  Decree 57/2025 and Decree 58/2025/ND-CP frameworks described here reflect the position
  as of May 2026. Always verify current requirements with qualified Vietnamese legal
  counsel, an experienced local advisor, and MOIT/EVN directly before relying on this
  package for a specific transaction. Foreign investors should obtain independent FX
  and repatriation advice from a bank authorised to operate in Vietnam.
