# ── Risk Flags (Jurisdiction Package) ────────────────────────────────────────
risk_flags:
  - risk_id: evn_counterparty_risk
    active: true
    severity: high
    note: >
      EVN is the only available grid operator and power buyer. No signed DPPA
      yet. If DPPA not achieved, revenue will be pure VWEM spot market via
      standard EVN contract with un-bankable standard terms. EVN counterparty
      risk is a structural feature of the Vietnamese market.

  - risk_id: curtailment_uncompensated
    active: true
    severity: high
    note: >
      Ninh Thuan Province is a HIGH-curtailment zone. Historical curtailment
      18–22% annually at comparable connection points. No curtailment
      compensation mechanism anticipated in any contract type. P50 yield
      estimate of 185 GWh/yr does NOT reflect curtailment — true net yield
      is materially lower. Mandatory disclosure at all levels above L0.

  - risk_id: lurc_agricultural_conversion
    active: true
    severity: medium
    note: >
      120 ha of 185 ha site is rice paddy requiring agricultural conversion
      approval from Ninh Thuan PPC. Approval is subject to EIA outcome and
      PPC discretion. Timeline estimated 12–18 months post-EIA approval.
      This is on the critical path to construction commencement.

  - risk_id: fx_convertibility_risk
    active: true
    severity: high
    note: >
      Financial model assumes full VND/USD convertibility without restriction.
      SBV approval requirements for large repatriations not modelled. For
      any international financing structure, FX risk must be addressed through
      structural mitigants or political risk insurance.

  - risk_id: irc_change_of_control
    active: true
    severity: medium
    note: >
      IRC change-of-control provisions require DPI notification and approval
      for the majority stake transfer contemplated in this transaction.
      Legal counsel review and DPI pre-consultation required before signing.
      Timeline impact must be incorporated in the closing schedule.

  - risk_id: evn_grid_monopoly
    active: true
    severity: medium
    note: >
      EVN technical conditions letter received but Grid Connection Agreement
      not signed. EVN is the sole grid operator; no alternative connection route.
      Agreement negotiation timeline subject to EVN capacity and priorities.

  - risk_id: fit_expired_claimed
    active: false
    note: >
      Project is a new development; no FiT is claimed. Revenue model is
      DPPA/VWEM under current Decree 57/2025 framework. Not applicable.

  - risk_id: land_not_secured
    active: true
    severity: high
    note: >
      LURC secured for only 35% of site (65 ha of 185 ha). Remaining 120 ha
      requires agricultural conversion approval. Land security is partial and
      insufficient for construction commencement or L2+ classification.
