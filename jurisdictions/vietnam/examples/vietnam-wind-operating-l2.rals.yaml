# ── Risk Flags (Jurisdiction Package) ────────────────────────────────────────
risk_flags:
  - risk_id: evn_counterparty_risk
    active: true
    severity: high
    note: >
      Revenue is 100% VWEM spot market via EVN at market prices. No DPPA in place.
      Standard EVN arrangements are un-bankable for international project finance
      in their current form. Any international refinancing will require structural
      mitigants. Domestic bank currently holds debt — domestic lenders have lower
      EVN counterparty risk concerns than international lenders.

  - risk_id: curtailment_uncompensated
    active: true
    severity: high
    note: >
      Historical curtailment consistently 15% annually. No compensation mechanism.
      Cumulative lost revenue from uncompensated curtailment estimated at
      USD 4.2m over 2022–2025. Financial model must use curtailment-adjusted
      P50 (approximately 125 GWh/yr, not 147 GWh/yr). This risk is ongoing and
      systemic — no improvement expected absent major grid reinforcement by EVN.

  - risk_id: fit_expired_claimed
    active: false
    note: >
      FiT is correctly NOT claimed for this project. Project commissioned
      September 2022, after the FiT 3 deadline of November 2021.
      Risk flag is inactive — revenue model correctly reflects VWEM spot.
      Any marketing material claiming FiT revenue for this project would
      trigger this flag as CRITICAL.

  - risk_id: fx_convertibility_risk
    active: true
    severity: high
    note: >
      All revenue in VND. No FX hedging or repatriation structure in place.
      Domestic bank facility is VND-denominated — VND/USD mismatch not an
      issue for current debt service but will be for any international refinancing.
      SBV approval for USD repatriation required. Must be structurally addressed
      before L3 classification or international financing.

  - risk_id: evn_metering_disputes
    active: true
    severity: medium
    note: >
      One resolved metering dispute (Q2–Q3 2023, VND 2.6bn recovered).
      One open metering dispute (Q1 2025, VND 2.25bn at stake). Open dispute
      must be disclosed and quantified. SPA should include reserve or condition
      precedent for resolution of open dispute. Metering dispute history suggests
      ongoing EVN settlement process risk.

  - risk_id: decree_regulatory_instability
    active: true
    severity: medium
    note: >
      Asset sells at VWEM spot prices under current Decree 58/2025/ND-CP framework.
      No transitional contract has been entered into (70% minimum output guarantee
      eligibility not confirmed). Regulatory framework changes could further affect
      VWEM market design. Revenue assumptions are subject to decree-level change risk.

  - risk_id: irc_change_of_control
    active: true
    severity: medium
    note: >
      Full acquisition (100% stake) triggers IRC change-of-control notification
      and DPI approval requirement. Binh Thuan DPI pre-consultation has not
      been initiated. Timeline estimate: 30–60 working days. Closing timeline
      must account for this process.

  - risk_id: evn_grid_monopoly
    active: true
    severity: medium
    note: >
      EVN Grid Connection Agreement is active and covers the operating period.
      However, EVN's monopoly position means curtailment management decisions
      are non-transparent and non-negotiable. No independent regulator exists
      to adjudicate curtailment disputes. Long-term grid congestion in Binh
      Thuan is unlikely to improve significantly in the near term.
