name: Tier Leak Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tier-leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Dependencies
        working-directory: reference/validator
        run: npm ci
        
      - name: Run Tier Leak Check
        working-directory: reference/validator
        run: node src/tier-leak-check.js ../../examples/*.rals.yaml
