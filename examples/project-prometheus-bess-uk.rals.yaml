# ============================================================================
# Renewable Asset Listing Standard (RALS) — Example Document
# ============================================================================
#
# Asset:        Project Prometheus (fictional)
# Description:  100 MW / 200 MWh battery energy storage system (BESS) at
#               Ready-to-Build stage. Located adjacent to an existing 400 kV
#               substation in Yorkshire, England. LFP chemistry, 2-hour
#               duration. Stacked revenue model: T-4 Capacity Market award,
#               Dynamic Containment frequency response, and merchant
#               wholesale arbitrage. Construction start Q4 2026, energization
#               Q3 2027.
# Profile:      Level 3 (Complete) — includes all confidentiality tiers
# Purpose:      Reference example accompanying RALS Specification v0.1
#
# This is a fictional asset. All names, financial figures, counterparties,
# equipment configurations, and contract terms are invented for illustration.
# Any resemblance to real assets, transactions, or entities is coincidental.
#
# Why this example exists:
#   BESS stresses RALS along three dimensions that PV and Wind do not:
#   (a) two capacity dimensions (MW power, MWh energy) with duration as
#       the dominant value driver,
#   (b) multi-stream revenue stack instead of single PPA — Capacity Market
#       + Frequency Response + Wholesale Arbitrage + Balancing Mechanism,
#   (c) Ready-to-Build lifecycle stage with no operating history, but rich
#       procurement, construction, and connection milestone data.
#   This example also demonstrates RALS in a non-EU jurisdiction (UK).
#
# Tier markers in comments:
#   [P] = public           (included in Teaser Profile)
#   [N] = nda_required     (visible after NDA)
#   [F] = final_shortlist  (visible only to admitted final bidders)
# ============================================================================

