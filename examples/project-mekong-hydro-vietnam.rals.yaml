# ============================================================================
# Renewable Asset Listing Standard (RALS) — Example Document
# ============================================================================
#
# Asset:        Project Mekong (fictional)
# Description:  38 MW run-of-river small hydropower plant in Lào Cai
#               Province, Northwest Vietnam. Operating since 2018, currently
#               under legacy FiT-derived PPA with EVN, evaluating transition
#               to DPPA mechanism under Decree 57/2025. Single-stage,
#               cascade-compatible design. International sponsor (European
#               renewable developer) divesting to focus on Southeast Asian
#               solar pipeline.
# Profile:      Level 3 (Complete) — includes all confidentiality tiers
# Purpose:      Reference example accompanying RALS Specification v0.1
#
# This is a fictional asset. All names, financial figures, counterparties,
# hydrological data, and contract terms are invented for illustration. The
# specific river, micro-location, and SPV are fabricated. Any resemblance
# to real assets, transactions, or entities is coincidental.
#
# Why this example exists:
#   Hydropower stresses RALS along four dimensions that PV, Wind, and BESS
#   do not:
#   (a) hydrology as the dominant production variable — 30+ year flow time
#       series rather than wind/solar resource assessment,
#   (b) water rights and concession structures rather than land lease or
#       freehold,
#   (c) cascading downstream/upstream interdependencies (sediment management,
#       fish passage, ecological flow obligations),
#   (d) emerging-market regulatory context (Vietnam DPPA mechanism under
#       Decree 57/2025, NSMO as independent grid operator, EVN as legacy
#       offtaker, USD/VND currency exposure).
#   This example demonstrates RALS in a non-EU, non-OECD jurisdiction with
#   different valuation drivers, transferability constraints, and risk
#   factors than the European/UK examples.
#
# Author's note on accuracy:
#   Vietnamese hydro regulatory specifics are drawn from publicly available
#   sources (Decree 57/2025, Electricity Law 2024, EVN PPA templates).
#   Where exact figures (e.g. provincial water royalty rates, specific
#   concession term limits) varied across sources or were unclear, the
#   example uses plausible values flagged in comments. Implementers building
#   real Vietnam-context RALS files should verify with Vietnamese counsel.
#
# Tier markers in comments:
#   [P] = public           (included in Teaser Profile)
#   [N] = nda_required     (visible after NDA)
#   [F] = final_shortlist  (visible only to admitted final bidders)
# ============================================================================

