# ============================================================================
# Renewable Asset Listing Standard (RALS) — Example Document
# ============================================================================
#
# Asset:        Project Atacama (fictional)
# Description:  Triple-hybrid renewable asset in Antofagasta Region, Chile.
#               180 MW solar PV + 80 MW onshore wind + 100 MW / 400 MWh
#               BESS behind a single 220 kV grid connection point. Operating
#               since June 2024 under 15-year USD-denominated PPA with major
#               Chilean copper mining group. Stacked revenue model:
#               primary PPA + capacity payments under DS 70/2023 + curtailment
#               mitigation value of BESS.
# Profile:      Level 3 (Complete) — includes all confidentiality tiers
# Purpose:      Reference example accompanying RALS Specification v0.1
#
# This is a fictional asset. All names, financial figures, counterparties,
# resource data, and contract terms are invented for illustration. The
# specific site, micro-location, and SPV are fabricated. Any resemblance to
# real assets, transactions, or entities is coincidental.
#
# Why this example exists:
#   Triple-hybrid (PV + Wind + BESS) is the hardest configuration RALS
#   must support. It stresses the spec along six dimensions simultaneously:
#   (a) three technology blocks sharing one connection point and one EMS,
#   (b) Chilean nodal price market with severe north-south price decoupling,
#   (c) curtailment economics (Atacama hit ~6 TWh curtailment in 2024),
#   (d) DS 70/2023 capacity payment regime (capacity payments derated by
#       duration; standalone BESS receives different treatment than hybrid),
#   (e) regulatory transition risk (DS 125 + DS 88 reform process withdrawn
#       by Kast administration March 2026 — material uncertainty),
#   (f) emerging market structure with USD-denominated PPA but CLP-
#       denominated cost base, requiring explicit FX modeling.
#
# Author's note on accuracy:
#   Chilean regulatory specifics are drawn from publicly available 2025-2026
#   sources (Law 21.505/2022, DS 70/2023, draft DS 125 / DS 88 reforms, CNE
#   capacity charge schedules, ACERA/Aurora market reports). The regulatory
#   environment is in active reform; the Kast administration withdrew the
#   DS 125 / DS 88 amendments from the Comptroller General's Office in
#   March 2026 for additional review. Real implementations must verify
#   current regulatory status with Chilean counsel — this example uses
#   the publicly documented status as of mid-2026.
#
# Tier markers in comments:
#   [P] = public           (included in Teaser Profile)
#   [N] = nda_required     (visible after NDA)
#   [F] = final_shortlist  (visible only to admitted final bidders)
# ============================================================================

